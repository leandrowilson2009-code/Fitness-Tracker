<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Fitness">
  <title>Fitness Tracker</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    
    :root {
      --bg: #000;
      --bg-elev-1: rgba(28, 28, 30, 0.72);
      --bg-elev-2: rgba(44, 44, 46, 0.6);
      --bg-elev-3: rgba(58, 58, 60, 0.5);
      --border: rgba(255, 255, 255, 0.06);
      --border-strong: rgba(255, 255, 255, 0.12);
      --text: #fff;
      --text-secondary: rgba(235, 235, 245, 0.6);
      --text-tertiary: rgba(235, 235, 245, 0.3);
      --green: #30D158;
      --blue: #0A84FF;
      --orange: #FF9F0A;
      --red: #FF453A;
      --purple: #BF5AF2;
      --yellow: #FFD60A;
      --teal: #64D2FF;
      --pink: #FF375F;
    }
    
    html, body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", system-ui, sans-serif;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
      letter-spacing: -0.01em;
    }
    
    body {
      padding-top: env(safe-area-inset-top);
      padding-bottom: calc(80px + env(safe-area-inset-bottom));
      min-height: 100vh;
      background: 
        radial-gradient(circle at 0% 0%, rgba(48, 209, 88, 0.08) 0%, transparent 40%),
        radial-gradient(circle at 100% 100%, rgba(10, 132, 255, 0.06) 0%, transparent 40%),
        #000;
      background-attachment: fixed;
    }
    
    #root { min-height: 100vh; }
    
    button { font-family: inherit; cursor: pointer; transition: all 0.2s; }
    button:active { transform: scale(0.96); }
    input { font-family: inherit; }
    
    /* Hide number input arrows */
    input[type=number]::-webkit-inner-spin-button,
    input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
    input[type=number] { -moz-appearance: textfield; }
    
    /* Scrollbar hide */
    ::-webkit-scrollbar { display: none; }
    
    /* Smooth transitions */
    .fade-in { animation: fadeIn 0.3s ease; }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(4px); }
      to { opacity: 1; transform: translateY(0); }
    }
    
    .slide-up { animation: slideUp 0.35s cubic-bezier(0.2, 0.8, 0.2, 1); }
    @keyframes slideUp {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* CUSTOM INPUT STYLING */
    .custom-input-wrapper {
      position: relative;
      width: 100%;
    }

    .custom-input {
      width: 100%;
      padding: 12px 14px;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 12px;
      color: var(--text);
      font-size: 14px;
      font-weight: 500;
      letter-spacing: -0.01em;
      transition: all 0.2s cubic-bezier(0.2, 0.8, 0.2, 1);
      outline: none;
      -webkit-appearance: none;
      appearance: none;
      backdrop-filter: blur(10px);
      WebkitBackdropFilter: blur(10px);
    }

    .custom-input::placeholder {
      color: rgba(235, 235, 245, 0.4);
    }

    .custom-input:focus {
      background: rgba(255, 255, 255, 0.1);
      border-color: rgba(255, 255, 255, 0.2);
      box-shadow: 0 0 0 2px rgba(10, 132, 255, 0.1);
    }

    .custom-input-label {
      display: block;
      font-size: 11px;
      font-weight: 600;
      color: var(--text-secondary);
      margin-bottom: 6px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    /* MEAL EDIT MODAL */
    .meal-edit-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.5);
      backdrop-filter: blur(10px);
      WebkitBackdropFilter: blur(10px);
      display: flex;
      align-items: flex-end;
      z-index: 1000;
      padding: 0;
      animation: fadeIn 0.2s ease;
    }

    .meal-edit-panel {
      width: 100%;
      background: linear-gradient(135deg, rgba(28, 28, 30, 0.95), rgba(44, 44, 46, 0.8));
      backdrop-filter: blur(20px);
      WebkitBackdropFilter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 20px 20px 0 0;
      padding: 24px;
      padding-bottom: calc(24px + env(safe-area-inset-bottom));
      max-height: 90vh;
      overflow-y: auto;
      animation: slideUp 0.3s cubic-bezier(0.2, 0.8, 0.2, 1);
    }

    .meal-edit-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 20px;
      gap: 12px;
    }

    .meal-edit-title {
      font-size: 18px;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    .close-btn {
      width: 32px;
      height: 32px;
      border-radius: 10px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.12);
      color: var(--text);
      font-size: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.2s;
    }

    .close-btn:hover {
      background: rgba(255, 255, 255, 0.12);
    }

    .meal-edit-fields {
      display: flex;
      flex-direction: column;
      gap: 16px;
      margin-bottom: 20px;
    }

    .meal-edit-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .meal-edit-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .btn-save {
      padding: 14px;
      background: linear-gradient(135deg, rgba(48, 209, 88, 0.2), rgba(48, 209, 88, 0.05));
      border: 1px solid rgba(48, 209, 88, 0.3);
      border-radius: 12px;
      color: var(--green);
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn-save:active {
      background: linear-gradient(135deg, rgba(48, 209, 88, 0.3), rgba(48, 209, 88, 0.1));
    }

    .btn-cancel {
      padding: 14px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 12px;
      color: var(--text-secondary);
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn-cancel:active {
      background: rgba(255, 255, 255, 0.1);
    }

    .btn-delete {
      padding: 10px;
      background: rgba(255, 69, 58, 0.1);
      border: 1px solid rgba(255, 69, 58, 0.25);
      border-radius: 10px;
      color: var(--red);
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      margin-top: 10px;
    }

    .btn-delete:active {
      background: rgba(255, 69, 58, 0.2);
    }
  </style>
</head>
<body>
  <div id="root"></div>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  
  <script type="text/babel">
    const { useState, useEffect } = React;

    const GOALS = { kcal: 2100, protein: 135, fat: 70, carbs: 240, water: 3000 };

    const mealPresets = [
      { name: "Omelette + Speck", kcal: 380, protein: 25, fat: 28, carbs: 2, emoji: "🍳" },
      { name: "Proteinshake (40g)", kcal: 160, protein: 32, fat: 2, carbs: 5, emoji: "🥤" },
      { name: "Skyr (200g)", kcal: 130, protein: 20, fat: 0.5, carbs: 6, emoji: "🥛" },
      { name: "Thon Baguette Migros", kcal: 550, protein: 17, fat: 18, carbs: 65, emoji: "🥖" },
      { name: "Thunfisch (120g) + Reis (150g)", kcal: 395, protein: 31, fat: 2, carbs: 42, emoji: "🍚" },
      { name: "Banane", kcal: 90, protein: 1, fat: 0.3, carbs: 23, emoji: "🍌" },
      { name: "Poulet + Gemüse", kcal: 420, protein: 50, fat: 15, carbs: 25, emoji: "🍗" },
      { name: "Döner", kcal: 650, protein: 28, fat: 35, carbs: 55, emoji: "🌯" },
      { name: "Wienerli im Teig", kcal: 320, protein: 11, fat: 22, carbs: 22, emoji: "🌭" },
      { name: "Emmi Latte Eiskaffee", kcal: 160, protein: 5, fat: 5, carbs: 24, emoji: "☕" },
    ];

    // ---------- COMPONENTS ----------
    
    function Card({ children, style = {}, gradient }) {
      return (
        <div style={{
          background: gradient || "var(--bg-elev-1)",
          backdropFilter: "blur(20px)",
          WebkitBackdropFilter: "blur(20px)",
          borderRadius: 20,
          padding: 16,
          border: "1px solid var(--border)",
          boxShadow: "0 4px 20px rgba(0,0,0,0.2)",
          ...style
        }}>
          {children}
        </div>
      );
    }

    function Ring({ value, max, color, label, unit, size = 110 }) {
      const stroke = 10, r = (size - stroke) / 2, circ = 2 * Math.PI * r;
      const pct = Math.min(value / max, 1), dash = pct * circ;
      const percentage = Math.round(pct * 100);
      
      return (
        <div style={{ display: "flex", flexDirection: "column", alignItems: "center", gap: 8 }}>
          <div style={{ position: "relative", width: size, height: size }}>
            <svg width={size} height={size} style={{ transform: "rotate(-90deg)" }}>
              <defs>
                <linearGradient id={`grad-${label}`} x1="0%" y1="0%" x2="100%" y2="100%">
                  <stop offset="0%" stopColor={color} stopOpacity="1" />
                  <stop offset="100%" stopColor={color} stopOpacity="0.7" />
                </linearGradient>
              </defs>
              <circle cx={size/2} cy={size/2} r={r} fill="none" stroke="rgba(255,255,255,0.06)" strokeWidth={stroke} />
              <circle cx={size/2} cy={size/2} r={r} fill="none" stroke={`url(#grad-${label})`} strokeWidth={stroke}
                strokeDasharray={`${dash} ${circ}`} strokeLinecap="round" 
                style={{ transition: "stroke-dasharray 0.8s cubic-bezier(0.2, 0.8, 0.2, 1)", filter: `drop-shadow(0 0 8px ${color}40)` }} />
            </svg>
            <div style={{ position: "absolute", inset: 0, display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center" }}>
              <div style={{ fontSize: 22, fontWeight: 700, color: "var(--text)", letterSpacing: "-0.02em" }}>{Math.round(value)}</div>
              <div style={{ fontSize: 10, color: "var(--text-secondary)", fontWeight: 500, textTransform: "uppercase", letterSpacing: "0.05em" }}>{unit}</div>
            </div>
          </div>
          <div style={{ display: "flex", flexDirection: "column", alignItems: "center", gap: 2 }}>
            <div style={{ fontSize: 13, color: "var(--text)", fontWeight: 600 }}>{label}</div>
            <div style={{ fontSize: 11, color: "var(--text-secondary)" }}>{percentage}% von {max}{unit === "g" ? "g" : ""}</div>
          </div>
        </div>
      );
    }

    function MacroBar({ value, max, color, label }) {
      const pct = Math.min((value / max) * 100, 100);
      return (
        <div style={{ flex: 1 }}>
          <div style={{ display: "flex", justifyContent: "space-between", marginBottom: 6 }}>
            <span style={{ fontSize: 11, color: "var(--text-secondary)", fontWeight: 500 }}>{label}</span>
            <span style={{ fontSize: 11, color: "var(--text)", fontWeight: 600 }}>{Math.round(value)}/{max}g</span>
          </div>
          <div style={{ height: 6, background: "rgba(255,255,255,0.06)", borderRadius: 3, overflow: "hidden" }}>
            <div style={{ height: "100%", background: color, width: `${pct}%`, transition: "width 0.5s ease", borderRadius: 3 }} />
          </div>
        </div>
      );
    }

    function SimpleLineGraph({ data, label, color, unit }) {
      if (!data || data.length === 0) return null;
      
      const min = Math.min(...data), max = Math.max(...data), range = max - min || 1;
      const width = 280, height = 120, padding = 20;
      const points = data.map((v, i) => ({
        x: padding + (i / (data.length - 1)) * (width - 2 * padding),
        y: padding + (1 - (v - min) / range) * (height - 2 * padding)
      }));
      
      const pathD = points.map((p, i) => `${i === 0 ? 'M' : 'L'} ${p.x} ${p.y}`).join(' ');
      
      return (
        <div style={{ marginBottom: 20 }}>
          <div style={{ fontSize: 12, fontWeight: 600, color: "var(--text-secondary)", marginBottom: 10 }}>{label}</div>
          <svg width={width} height={height} style={{ display: "block" }}>
            <defs>
              <linearGradient id={`fill-${label}`} x1="0%" y1="0%" x2="0%" y2="100%">
                <stop offset="0%" stopColor={color} stopOpacity="0.3" />
                <stop offset="100%" stopColor={color} stopOpacity="0" />
              </linearGradient>
            </defs>
            <path d={pathD} fill="none" stroke={color} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" />
            <path d={`${pathD} L ${points[points.length - 1].x} ${height} L ${points[0].x} ${height} Z`} fill={`url(#fill-${label})`} />
            {points.map((p, i) => <circle key={i} cx={p.x} cy={p.y} r="3" fill={color} />)}
          </svg>
          <div style={{ fontSize: 11, color: "var(--text-secondary)", display: "flex", justifyContent: "space-between" }}>
            <span>{min.toFixed(1)}{unit}</span>
            <span>{max.toFixed(1)}{unit}</span>
          </div>
        </div>
      );
    }

    function SectionHeader({ icon, title }) {
      return (
        <div style={{ display: "flex", alignItems: "center", gap: 8, marginBottom: 14 }}>
          <span style={{ fontSize: 18 }}>{icon}</span>
          <span style={{ fontSize: 16, fontWeight: 700, letterSpacing: "-0.01em" }}>{title}</span>
        </div>
      );
    }

    // CUSTOM INPUT COMPONENT
    function CustomInput({ label, value, onChange, type = "text", placeholder = "" }) {
      return (
        <div className="custom-input-wrapper">
          {label && <label className="custom-input-label">{label}</label>}
          <input
            type={type}
            value={value}
            onChange={(e) => onChange(e.target.value)}
            placeholder={placeholder}
            className="custom-input"
          />
        </div>
      );
    }

    // MEAL EDIT MODAL
    function MealEditModal({ meal, mealIndex, onSave, onCancel, onDelete }) {
      const [editName, setEditName] = useState(meal.name);
      const [editKcal, setEditKcal] = useState(meal.kcal);
      const [editProtein, setEditProtein] = useState(meal.protein);
      const [editFat, setEditFat] = useState(meal.fat);
      const [editCarbs, setEditCarbs] = useState(meal.carbs);

      const handleSave = () => {
        const updated = {
          ...meal,
          name: editName,
          kcal: +editKcal,
          protein: +editProtein,
          fat: +editFat,
          carbs: +editCarbs
        };
        onSave(mealIndex, updated);
      };

      return (
        <div className="meal-edit-overlay" onClick={onCancel}>
          <div className="meal-edit-panel" onClick={(e) => e.stopPropagation()}>
            <div className="meal-edit-header">
              <div className="meal-edit-title">Bearbeite: {meal.emoji}</div>
              <button className="close-btn" onClick={onCancel}>✕</button>
            </div>

            <div className="meal-edit-fields">
              <CustomInput
                label="Name"
                value={editName}
                onChange={setEditName}
                placeholder="Mahlzeit Name"
              />

              <div className="meal-edit-grid">
                <CustomInput
                  label="Kalorien"
                  value={editKcal}
                  onChange={setEditKcal}
                  type="number"
                  placeholder="kcal"
                />
                <CustomInput
                  label="Protein"
                  value={editProtein}
                  onChange={setEditProtein}
                  type="number"
                  placeholder="g"
                />
              </div>

              <div className="meal-edit-grid">
                <CustomInput
                  label="Fett"
                  value={editFat}
                  onChange={setEditFat}
                  type="number"
                  placeholder="g"
                />
                <CustomInput
                  label="Kohlenhydrate"
                  value={editCarbs}
                  onChange={setEditCarbs}
                  type="number"
                  placeholder="g"
                />
              </div>
            </div>

            <div className="meal-edit-actions">
              <button className="btn-save" onClick={handleSave}>💾 Speichern</button>
              <button className="btn-cancel" onClick={onCancel}>Abbrechen</button>
            </div>

            <button className="btn-delete" onClick={() => onDelete(mealIndex)} style={{ width: "100%" }}>
              🗑️ Löschen
            </button>
          </div>
        </div>
      );
    }

    // MAIN APP
    function FitnessTracker() {
      const [data, setData] = useState(() => {
        const saved = localStorage.getItem("fitnessData");
        return saved ? JSON.parse(saved) : {
          meals: [],
          water: 0,
          workouts: [],
          sleepStart: "", sleepEnd: "", sleepScore: 5,
          weight: 70, bodyFat: 0,
          history: []
        };
      });

      const [tab, setTab] = useState("today");
      const [editingMeal, setEditingMeal] = useState(null);

      useEffect(() => {
        localStorage.setItem("fitnessData", JSON.stringify(data));
      }, [data]);

      const addMeal = (meal) => {
        setData(prev => ({ ...prev, meals: [...prev.meals, meal] }));
      };

      const removeMeal = (i) => {
        setData(prev => ({ ...prev, meals: prev.meals.filter((_, idx) => idx !== i) }));
      };

      const updateMeal = (index, updatedMeal) => {
        setData(prev => {
          const newMeals = [...prev.meals];
          newMeals[index] = updatedMeal;
          return { ...prev, meals: newMeals };
        });
        setEditingMeal(null);
      };

      const addWater = () => setData(prev => ({ ...prev, water: prev.water + 250 }));
      const clearWater = () => setData(prev => ({ ...prev, water: 0 }));

      const addWorkout = (workout) => {
        setData(prev => ({ ...prev, workouts: [...prev.workouts, workout] }));
      };

      const removeWorkout = (i) => {
        setData(prev => ({ ...prev, workouts: prev.workouts.filter((_, idx) => idx !== i) }));
      };

      const saveSleep = () => {
        if (!data.sleepStart || !data.sleepEnd) return alert("Trag Start & End ein");
        const start = new Date(`2000-01-01T${data.sleepStart}`);
        const end = new Date(`2000-01-01T${data.sleepEnd}`);
        let dur = (end - start) / 3600000;
        if (dur < 0) dur += 24;
        setData(prev => ({ ...prev, history: [...prev.history, { date: new Date().toISOString().split('T')[0], kcal: prev.meals.reduce((s, m) => s + m.kcal, 0), sleep: dur, sleepScore: prev.sleepScore, weight: prev.weight, bodyFat: prev.bodyFat }], sleepStart: "", sleepEnd: "" }));
      };

      const exportData = () => {
        const json = JSON.stringify(data, null, 2);
        const blob = new Blob([json], { type: "application/json" });
        const a = document.createElement("a");
        a.href = URL.createObjectURL(blob);
        a.download = `fitness-${new Date().toISOString().split('T')[0]}.json`;
        a.click();
      };

      const importData = () => {
        const input = document.createElement("input");
        input.type = "file";
        input.accept = ".json";
        input.onchange = (e) => {
          const f = e.target.files[0];
          const r = new FileReader();
          r.onload = (ev) => {
            try {
              const imported = JSON.parse(ev.target.result);
              setData(imported);
            } catch (err) {
              alert("Fehler beim Laden");
            }
          };
          r.readAsText(f);
        };
        input.click();
      };

      const totalKcal = data.meals.reduce((s, m) => s + m.kcal, 0);
      const totalProtein = data.meals.reduce((s, m) => s + m.protein, 0);
      const totalFat = data.meals.reduce((s, m) => s + m.fat, 0);
      const totalCarbs = data.meals.reduce((s, m) => s + m.carbs, 0);

      const avgKcal = data.history.length ? Math.round(data.history.reduce((s, h) => s + h.kcal, 0) / data.history.length) : 0;
      const avgProtein = data.history.length ? Math.round(data.history.reduce((s, h) => s + (h.meals ? h.meals.reduce((ss, m) => ss + m.protein, 0) : 0), 0) / data.history.length) : 0;
      const avgSleepDuration = data.history.length ? (data.history.reduce((s, h) => s + h.sleep, 0) / data.history.length).toFixed(1) : 0;
      const avgSleepScore = data.history.length ? Math.round(data.history.reduce((s, h) => s + h.sleepScore, 0) / data.history.length) : 0;

      const bodyCompData = data.history.filter(h => h.weight > 0 || h.bodyFat > 0);

      const btnSecondary = { padding: "10px 14px", background: "var(--bg-elev-2)", border: "1px solid var(--border-strong)", borderRadius: 14, color: "var(--text)", fontWeight: 600, cursor: "pointer" };

      return (
        <div style={{ paddingLeft: 16, paddingRight: 16 }}>
          {/* HEADER */}
          <div style={{ paddingTop: 20, paddingBottom: 20 }}>
            <div style={{ fontSize: 32, fontWeight: 700, letterSpacing: "-0.02em" }}>💪 Fitness</div>
            <div style={{ fontSize: 13, color: "var(--text-secondary)", marginTop: 4 }}>
              {new Date().toLocaleDateString("de-CH", { weekday: "long", month: "long", day: "numeric" })}
            </div>
          </div>

          {/* CONTENT */}
          {tab === "today" && (
            <div className="fade-in" style={{ display: "flex", flexDirection: "column", gap: 16 }}>
              {/* MACRO RINGS */}
              <Card>
                <SectionHeader icon="📊" title="Tagesübersicht" />
                <div style={{ display: "grid", gridTemplateColumns: "repeat(2, 1fr)", gap: 20, marginBottom: 20 }}>
                  <Ring value={totalKcal} max={GOALS.kcal} color="var(--orange)" label="Kalorien" unit="" size={100} />
                  <Ring value={totalProtein} max={GOALS.protein} color="var(--blue)" label="Protein" unit="g" size={100} />
                </div>
              </Card>

              {/* MACROS */}
              <Card>
                <SectionHeader icon="🥗" title="Makros" />
                <div style={{ display: "flex", flexDirection: "column", gap: 12 }}>
                  <MacroBar value={totalFat} max={GOALS.fat} color="var(--pink)" label="Fett" />
                  <MacroBar value={totalCarbs} max={GOALS.carbs} color="var(--yellow)" label="Kohlenhydrate" />
                  <MacroBar value={data.water} max={GOALS.water} color="var(--teal)" label="Wasser" />
                </div>
              </Card>

              {/* WATER */}
              <Card>
                <SectionHeader icon="💧" title="Wasser" />
                <div style={{ display: "flex", gap: 10, marginBottom: 12 }}>
                  <button onClick={addWater} style={{ flex: 1, padding: "12px", background: "var(--bg-elev-2)", border: "1px solid var(--border-strong)", borderRadius: 14, color: "var(--text)", fontWeight: 600, cursor: "pointer" }}>+250ml</button>
                  <button onClick={clearWater} style={{ flex: 1, padding: "12px", background: "rgba(255,69,58,0.1)", border: "1px solid rgba(255,69,58,0.25)", borderRadius: 14, color: "var(--red)", fontWeight: 600, cursor: "pointer" }}>Reset</button>
                </div>
                <div style={{ fontSize: 13, color: "var(--text-secondary)" }}>{data.water}/{GOALS.water}ml ({Math.round((data.water / GOALS.water) * 100)}%)</div>
              </Card>

              {/* SLEEP */}
              <Card>
                <SectionHeader icon="😴" title="Schlaf" />
                <div style={{ display: "flex", gap: 10, marginBottom: 12 }}>
                  <input type="time" value={data.sleepStart} onChange={(e) => setData(prev => ({ ...prev, sleepStart: e.target.value }))} style={{ flex: 1, padding: "10px", background: "var(--bg-elev-2)", border: "1px solid var(--border-strong)", borderRadius: 12, color: "var(--text)", fontSize: 13 }} placeholder="Start" />
                  <input type="time" value={data.sleepEnd} onChange={(e) => setData(prev => ({ ...prev, sleepEnd: e.target.value }))} style={{ flex: 1, padding: "10px", background: "var(--bg-elev-2)", border: "1px solid var(--border-strong)", borderRadius: 12, color: "var(--text)", fontSize: 13 }} placeholder="End" />
                </div>
                <div style={{ display: "flex", gap: 10, marginBottom: 12 }}>
                  <input type="range" min="1" max="10" value={data.sleepScore} onChange={(e) => setData(prev => ({ ...prev, sleepScore: +e.target.value }))} style={{ flex: 1 }} />
                  <span style={{ fontSize: 13, color: "var(--text-secondary)", minWidth: 30 }}>⭐ {data.sleepScore}</span>
                </div>
                <button onClick={saveSleep} style={{ ...btnSecondary, width: "100%", padding: "12px" }}>Speichern</button>
              </Card>
            </div>
          )}

          {tab === "mahlzeiten" && (
            <div className="fade-in" style={{ display: "flex", flexDirection: "column", gap: 16 }}>
              {/* PRESETS */}
              <Card>
                <SectionHeader icon="🍽️" title="Hinzufügen" />
                <div style={{ display: "flex", flexDirection: "column", gap: 10 }}>
                  {mealPresets.map((m, i) => (
                    <button key={i} onClick={() => addMeal(m)} style={{
                      padding: "14px 16px", background: "linear-gradient(135deg, rgba(48,209,88,0.08), rgba(48,209,88,0.02))",
                      border: "1px solid rgba(48,209,88,0.25)", borderRadius: 14, color: "var(--text)", cursor: "pointer",
                      textAlign: "left", display: "flex", alignItems: "center", gap: 12, transition: "all 0.2s"
                    }}>
                      <div style={{ fontSize: 24 }}>{m.emoji}</div>
                      <div style={{ flex: 1 }}>
                        <div style={{ fontSize: 14, fontWeight: 700 }}>{m.name}</div>
                        <div style={{ fontSize: 11, color: "var(--text-secondary)", marginTop: 2 }}>{m.kcal} kcal • {m.protein}g P</div>
                      </div>
                      <div style={{ fontSize: 13, color: "var(--text-secondary)", fontWeight: 600 }}>›</div>
                    </button>
                  ))}
                </div>
              </Card>

              {/* MEALS TODAY */}
              {data.meals.length > 0 && (
                <div>
                  <SectionHeader icon="📋" title={`Heute (${data.meals.length})`} />
                  <div style={{ display: "flex", flexDirection: "column", gap: 10 }}>
                    {data.meals.map((m, i) => (
                      <Card key={i} style={{ padding: "14px 16px", cursor: "pointer", transition: "all 0.2s" }} 
                            onClick={() => setEditingMeal(i)}>
                        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", gap: 12 }}>
                          <div style={{ flex: 1, minWidth: 0 }}>
                            <div style={{ fontSize: 14, fontWeight: 600, marginBottom: 4 }}>
                              {m.emoji} {m.name}
                            </div>
                            <div style={{ display: "flex", gap: 12, fontSize: 12, color: "var(--text-secondary)", fontWeight: 500, flexWrap: "wrap" }}>
                              <span>🔥 {m.kcal} kcal</span>
                              <span>💪 {m.protein}g</span>
                              <span>🥑 {m.fat}g F</span>
                              <span>🍞 {m.carbs}g C</span>
                            </div>
                          </div>
                          <button onClick={(e) => { e.stopPropagation(); removeMeal(i); }}
                            style={{ width: 38, height: 38, borderRadius: 12, background: "rgba(255,69,58,0.15)", border: "1px solid rgba(255,69,58,0.25)", color: "var(--red)", fontSize: 16, fontWeight: 700, cursor: "pointer", flexShrink: 0 }}>✕</button>
                        </div>
                      </Card>
                    ))}
                  </div>
                </div>
              )}
            </div>
          )}

          {tab === "workout" && (
            <div className="fade-in" style={{ display: "flex", flexDirection: "column", gap: 16 }}>
              {/* JOGGING */}
              <Card>
                <SectionHeader icon="🏃" title="Laufen" />
                <div style={{ display: "flex", flexDirection: "column", gap: 10 }}>
                  {[
                    { id: "5km", label: "🏃 5km", km: 5 },
                    { id: "10km", label: "🏃 10km", km: 10 },
                  ].map(art => (
                    <button key={art.id} onClick={() => {
                      const dauer = prompt(`${art.label}\nDauer (Minuten):`);
                      if (dauer) addWorkout({ art: art.label, dauer: +dauer, km: art.km });
                    }} style={{
                      padding: "16px 14px", background: "linear-gradient(135deg, rgba(10,132,255,0.08), rgba(10,132,255,0.02))",
                      border: "1px solid rgba(10,132,255,0.25)", borderRadius: 14, color: "var(--text)", cursor: "pointer",
                      textAlign: "left", display: "flex", alignItems: "center", gap: 12, transition: "all 0.2s"
                    }}>
                      <div style={{ fontSize: 24 }}>🏃</div>
                      <div style={{ flex: 1 }}>
                        <div style={{ fontSize: 14, fontWeight: 700 }}>{art.label.slice(2)}</div>
                      </div>
                      <div style={{ fontSize: 13, color: "var(--text-secondary)", fontWeight: 600 }}>›</div>
                    </button>
                  ))}
                </div>
              </Card>

              {/* STRENGTH */}
              <Card>
                <SectionHeader icon="💪" title="Kraft" />
                <div style={{ display: "flex", flexDirection: "column", gap: 10 }}>
                  {[
                    { id: "Oberkörper", label: "💪 Oberkörper", emoji: "💪" },
                    { id: "Unterkörper", label: "🦵 Unterkörper", emoji: "🦵" },
                  ].map(art => (
                    <button key={art.id} onClick={() => {
                      const dauer = prompt(`${art.label}\nDauer (Minuten):`);
                      if (dauer) addWorkout({ art: art.id, dauer: +dauer });
                    }} style={{
                      padding: "16px 14px", background: "linear-gradient(135deg, rgba(191,90,242,0.08), rgba(191,90,242,0.02))",
                      border: "1px solid rgba(191,90,242,0.25)", borderRadius: 14, color: "var(--text)", cursor: "pointer",
                      textAlign: "left", display: "flex", alignItems: "center", gap: 12, transition: "all 0.2s"
                    }}>
                      <div style={{ fontSize: 24 }}>{art.emoji}</div>
                      <div style={{ flex: 1 }}>
                        <div style={{ fontSize: 14, fontWeight: 700 }}>{art.label.slice(2)}</div>
                      </div>
                      <div style={{ fontSize: 13, color: "var(--text-secondary)", fontWeight: 600 }}>›</div>
                    </button>
                  ))}
                </div>
              </Card>

              {data.workouts.length > 0 && (
                <div>
                  <SectionHeader icon="📋" title={`Heute (${data.workouts.length})`} />
                  <div style={{ display: "flex", flexDirection: "column", gap: 10 }}>
                    {data.workouts.map((w, i) => (
                      <Card key={i} style={{ padding: "14px 16px" }}>
                        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", gap: 12 }}>
                          <div style={{ flex: 1, minWidth: 0 }}>
                            <div style={{ fontSize: 14, fontWeight: 600, marginBottom: 4 }}>{w.art}</div>
                            <div style={{ display: "flex", gap: 12, fontSize: 12, color: "var(--text-secondary)", fontWeight: 500 }}>
                              <span>⏱️ {w.dauer}min</span>
                              {w.km > 0 && <span>📍 {w.km}km</span>}
                            </div>
                          </div>
                          <button onClick={() => removeWorkout(i)}
                            style={{ width: 38, height: 38, borderRadius: 12, background: "rgba(255,69,58,0.15)", border: "1px solid rgba(255,69,58,0.25)", color: "var(--red)", fontSize: 16, fontWeight: 700, cursor: "pointer", flexShrink: 0 }}>✕</button>
                        </div>
                      </Card>
                    ))}
                  </div>
                </div>
              )}
            </div>
          )}

          {tab === "fortschritt" && (
            <div className="fade-in" style={{ display: "flex", flexDirection: "column", gap: 16 }}>
              <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 8 }}>
                <button onClick={exportData} style={{ ...btnSecondary, padding: "12px", fontSize: 13 }}>💾 Export</button>
                <button onClick={importData} style={{ ...btnSecondary, padding: "12px", fontSize: 13 }}>📂 Import</button>
              </div>

              <Card>
                <SectionHeader icon="📊" title="7-Tage Durchschnitt" />
                <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 14 }}>
                  {[
                    { label: "Schlaf", value: `${avgSleepDuration}h`, color: "var(--purple)", icon: "😴" },
                    { label: "Schlaf Score", value: avgSleepScore, color: "var(--teal)", icon: "⭐" },
                    { label: "Ø Kalorien", value: avgKcal, color: "var(--orange)", icon: "🔥" },
                    { label: "Ø Protein", value: `${avgProtein}g`, color: "var(--blue)", icon: "💪" },
                  ].map((s, i) => (
                    <div key={i} style={{ padding: 12, background: "rgba(255,255,255,0.03)", borderRadius: 14, border: "1px solid var(--border)" }}>
                      <div style={{ fontSize: 16 }}>{s.icon}</div>
                      <div style={{ fontSize: 11, color: "var(--text-secondary)", marginTop: 4, fontWeight: 600, textTransform: "uppercase", letterSpacing: "0.05em" }}>{s.label}</div>
                      <div style={{ fontSize: 22, fontWeight: 700, color: s.color, marginTop: 2, letterSpacing: "-0.02em" }}>{s.value}</div>
                    </div>
                  ))}
                </div>
              </Card>

              <Card>
                <SectionHeader icon="⚖️" title="Body Composition" />
                {bodyCompData.length > 0 ? (
                  <>
                    <SimpleLineGraph data={bodyCompData.map(d => d.weight).filter(w => w)} label="Gewicht" color="#0A84FF" unit="kg" />
                    <SimpleLineGraph data={bodyCompData.map(d => d.bodyFat).filter(bf => bf)} label="Körperfett" color="#FF453A" unit="%" />
                  </>
                ) : (
                  <div style={{ textAlign: "center", padding: 20 }}>
                    <div style={{ fontSize: 32, marginBottom: 8 }}>📈</div>
                    <div style={{ fontSize: 13, color: "var(--text-secondary)" }}>Trag morgens Gewicht & KFA ein um Trends zu sehen</div>
                  </div>
                )}
              </Card>
            </div>
          )}

          {/* BOTTOM NAV */}
          <div style={{
            position: "fixed", bottom: 0, left: 0, right: 0,
            background: "rgba(0,0,0,0.85)",
            backdropFilter: "blur(30px)",
            WebkitBackdropFilter: "blur(30px)",
            borderTop: "1px solid var(--border)",
            paddingBottom: "env(safe-area-inset-bottom)",
            zIndex: 100
          }}>
            <div style={{ display: "grid", gridTemplateColumns: "repeat(4, 1fr)", padding: "8px 4px" }}>
              {[
                { key: "today", label: "Übersicht", icon: "📊" },
                { key: "mahlzeiten", label: "Mahlzeiten", icon: "🍽️" },
                { key: "workout", label: "Training", icon: "💪" },
                { key: "fortschritt", label: "Stats", icon: "📈" },
              ].map(t => (
                <button key={t.key} onClick={() => setTab(t.key)} style={{
                  padding: "8px 4px", border: "none", background: "transparent",
                  display: "flex", flexDirection: "column", alignItems: "center", gap: 4,
                  color: tab === t.key ? "var(--green)" : "var(--text-secondary)",
                  cursor: "pointer", position: "relative"
                }}>
                  <div style={{
                    fontSize: 22,
                    transform: tab === t.key ? "scale(1.1)" : "scale(1)",
                    transition: "transform 0.2s"
                  }}>{t.icon}</div>
                  <div style={{ fontSize: 10, fontWeight: 600 }}>{t.label}</div>
                  {tab === t.key && (
                    <div style={{
                      position: "absolute", top: 0, left: "50%", transform: "translateX(-50%)",
                      width: 24, height: 3, background: "var(--green)", borderRadius: "0 0 4px 4px"
                    }} />
                  )}
                </button>
              ))}
            </div>
          </div>

          {/* MEAL EDIT MODAL */}
          {editingMeal !== null && (
            <MealEditModal
              meal={data.meals[editingMeal]}
              mealIndex={editingMeal}
              onSave={updateMeal}
              onCancel={() => setEditingMeal(null)}
              onDelete={removeMeal}
            />
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<FitnessTracker />);
  </script>
</body>
</html>
