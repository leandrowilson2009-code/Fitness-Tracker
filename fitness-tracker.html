<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0d1117">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Fitness Tracker">
  <title>Fitness Tracker</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0d1117;
      color: #f0f4ff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      overflow-x: hidden;
    }
    #root { padding-bottom: 60px; }
  </style>
</head>
<body>
  <div id="root"></div>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  
  <script type="text/babel">
    const { useState, useEffect } = React;

    const GOALS = { kcal: 2100, protein: 135, fat: 70, carbs: 240, water: 3000 };

    const mealPresets = [
      { name: "Omelette + Speck", kcal: 380, protein: 25, fat: 28, carbs: 2 },
      { name: "Proteinshake (40g)", kcal: 160, protein: 32, fat: 2, carbs: 5 },
      { name: "Skyr (200g)", kcal: 130, protein: 20, fat: 0.5, carbs: 6 },
      { name: "Thon Baguette Migros", kcal: 550, protein: 17, fat: 18, carbs: 65 },
      { name: "Thunfisch (80g) + Reis", kcal: 373, protein: 25, fat: 2, carbs: 48 },
      { name: "Banane", kcal: 90, protein: 1, fat: 0.3, carbs: 23 },
      { name: "Poulet + Gemüse", kcal: 420, protein: 50, fat: 15, carbs: 25 },
      { name: "Döner", kcal: 650, protein: 28, fat: 35, carbs: 55 },
      { name: "Wienerli im Teig (Migros)", kcal: 320, protein: 11, fat: 22, carbs: 22 },
      { name: "Emmi Latte Eiskaffee", kcal: 160, protein: 5, fat: 5, carbs: 24 },
    ];

    function Ring({ value, max, color, label, unit }) {
      const size = 90, stroke = 8, r = (size - stroke) / 2, circ = 2 * Math.PI * r;
      const pct = Math.min(value / max, 1), dash = pct * circ;
      return (
        <div style={{ display: "flex", flexDirection: "column", alignItems: "center", gap: 4 }}>
          <svg width={size} height={size} style={{ transform: "rotate(-90deg)" }}>
            <circle cx={size/2} cy={size/2} r={r} fill="none" stroke="#1e2530" strokeWidth={stroke} />
            <circle cx={size/2} cy={size/2} r={r} fill="none" stroke={color} strokeWidth={stroke}
              strokeDasharray={`${dash} ${circ}`} strokeLinecap="round" style={{ transition: "stroke-dasharray 0.6s" }} />
          </svg>
          <div style={{ textAlign: "center", marginTop: -size/2 - 4, lineHeight: 1 }}>
            <div style={{ fontSize: 18, fontWeight: 800, color: "#f0f4ff" }}>{value}</div>
            <div style={{ fontSize: 10, color: "#6b7a99" }}>{unit}</div>
          </div>
          <div style={{ fontSize: 11, color: "#8892aa", marginTop: size/2 - 8 }}>{label}</div>
        </div>
      );
    }

    function getMealHealth(meal) {
      const proteinRatio = meal.protein / meal.kcal * 100;
      const carbRatio = meal.carbs / meal.kcal * 100;
      const fatRatio = meal.fat / meal.kcal * 100;
      
      if (meal.fat > 25 && proteinRatio < 6) return "🥀";
      if (meal.carbs > 55) return "🥀";
      if (meal.fat > 32) return "🥀";
      if (meal.protein < 3 && meal.carbs > 40) return "🥀";
      
      return "✅";
    }

    function SimpleLineGraph({ data, label, color, unit, height = 120 }) {
      if (!data || data.length < 2) return <div style={{ fontSize: 11, color: "#6b7a99", padding: 12 }}>Noch keine Daten</div>;
      
      const min = Math.min(...data) - 1;
      const max = Math.max(...data) + 1;
      const range = max - min;
      const w = 280, h = height;
      const pointW = w / (data.length - 1);
      
      const points = data.map((v, i) => ({
        x: i * pointW,
        y: h - ((v - min) / range) * h
      }));
      
      const pathD = points.map((p, i) => `${i === 0 ? 'M' : 'L'} ${p.x} ${p.y}`).join(' ');
      
      return (
        <div style={{ marginBottom: 12 }}>
          <div style={{ fontSize: 11, color: "#6b7a99", marginBottom: 4 }}>{label} ({data[data.length - 1]}{unit})</div>
          <svg width={w} height={h} style={{ background: "#0d1117", borderRadius: 8 }}>
            <path d={pathD} stroke={color} strokeWidth="2" fill="none" />
            {points.map((p, i) => <circle key={i} cx={p.x} cy={p.y} r="2" fill={color} />)}
          </svg>
          <div style={{ fontSize: 9, color: "#6b7a99", marginTop: 2 }}>Min: {min.toFixed(1)}{unit} | Max: {max.toFixed(1)}{unit}</div>
        </div>
      );
    }

    export default function FitnessTracker() {
      const [allData, setAllData] = useState({});
      const [currentDate, setCurrentDate] = useState(new Date().toISOString().split('T')[0]);
      const [tab, setTab] = useState("today");
      const [showMealForm, setShowMealForm] = useState(false);
      const [meal, setMeal] = useState({ name: "", kcal: "", protein: "" });
      const [showCalendar, setShowCalendar] = useState(false);
      const [showResetConfirm, setShowResetConfirm] = useState(false);

      const exportData = () => {
        const dataStr = JSON.stringify(allData, null, 2);
        const dataBlob = new Blob([dataStr], { type: "application/json" });
        const url = URL.createObjectURL(dataBlob);
        const link = document.createElement("a");
        link.href = url;
        link.download = `fitness-backup-${new Date().toISOString().split('T')[0]}.json`;
        link.click();
        URL.revokeObjectURL(url);
      };

      const importData = () => {
        const input = document.createElement("input");
        input.type = "file";
        input.accept = ".json";
        input.onchange = (e) => {
          const file = e.target.files[0];
          if (!file) return;
          const reader = new FileReader();
          reader.onload = (event) => {
            try {
              const imported = JSON.parse(event.target.result);
              setAllData(imported);
              alert("✅ Daten erfolgreich importiert!");
            } catch (err) {
              alert("❌ Fehler beim Importieren. Datei ist kein gültiges JSON.");
            }
          };
          reader.readAsText(file);
        };
        input.click();
      };

      useEffect(() => {
        const saved = localStorage.getItem("fitnessData");
        if (saved) setAllData(JSON.parse(saved));
      }, []);

      useEffect(() => {
        localStorage.setItem("fitnessData", JSON.stringify(allData));
      }, [allData]);

      const data = allData[currentDate] || { 
        meals: [], workouts: [], water: 0, sleepDuration: 0, sleepScore: 0,
        bodyComp: false, kreatin: false, meds: false, 
        proteinShake: false, weight: null, bodyFat: null
      };

      const updateDay = (updates) => setAllData(prev => ({ ...prev, [currentDate]: { ...data, ...updates } }));
      const addMeal = (meal) => updateDay({ meals: [...data.meals, meal] });
      const removeMeal = (i) => updateDay({ meals: data.meals.filter((_, idx) => idx !== i) });
      const addWorkout = (workout) => updateDay({ workouts: [...data.workouts, workout] });
      const removeWorkout = (i) => updateDay({ workouts: data.workouts.filter((_, idx) => idx !== i) });
      const addWater = (ml) => updateDay({ water: data.water + ml });
      
      const totals = {
        kcal: data.meals.reduce((sum, m) => sum + (m.kcal || 0), 0),
        protein: data.meals.reduce((sum, m) => sum + (m.protein || 0), 0),
        fat: data.meals.reduce((sum, m) => sum + (m.fat || 0), 0),
        carbs: data.meals.reduce((sum, m) => sum + (m.carbs || 0), 0),
      };

      const formatDate = (dateStr) => new Date(dateStr + 'T00:00:00').toLocaleDateString("de-CH", { weekday: "long", month: "short", day: "numeric" });

      const getWeekStats = () => {
        const stats = [];
        for (let i = 6; i >= 0; i--) {
          const d = new Date();
          d.setDate(d.getDate() - i);
          const dateStr = d.toISOString().split('T')[0];
          const dayData = allData[dateStr];
          if (dayData?.meals.length) {
            const kcal = dayData.meals.reduce((sum, m) => sum + (m.kcal || 0), 0);
            const protein = dayData.meals.reduce((sum, m) => sum + (m.protein || 0), 0);
            const fat = dayData.meals.reduce((sum, m) => sum + (m.fat || 0), 0);
            const carbs = dayData.meals.reduce((sum, m) => sum + (m.carbs || 0), 0);
            stats.push({ kcal, protein, fat, carbs });
          }
        }
        return stats;
      };

      const weekData = getWeekStats();
      const avgKcal = weekData.length ? Math.round(weekData.reduce((sum, d) => sum + d.kcal, 0) / weekData.length) : 0;
      const avgProtein = weekData.length ? Math.round(weekData.reduce((sum, d) => sum + d.protein, 0) / weekData.length) : 0;

      const sleepDays = [...Array(7)].map((_, i) => {
        const d = new Date();
        d.setDate(d.getDate() - i);
        return allData[d.toISOString().split('T')[0]];
      }).filter(d => d && d.sleepDuration);
      
      const avgSleepDuration = sleepDays.length ? (sleepDays.reduce((sum, d) => sum + d.sleepDuration, 0) / sleepDays.length).toFixed(1) : 0;
      const avgSleepScore = sleepDays.length ? Math.round(sleepDays.reduce((sum, d) => sum + d.sleepScore, 0) / sleepDays.length) : 0;

      const bodyCompGraphData = [...Array(14)].map((_, i) => {
        const d = new Date();
        d.setDate(d.getDate() - (13 - i));
        return allData[d.toISOString().split('T')[0]];
      }).filter(d => d && (d.weight || d.bodyFat));

      const kmToday = data.workouts.reduce((sum, w) => {
        if (w.art === "5k") return sum + 5;
        if (w.art === "10k") return sum + 10;
        if (w.art === "Intervalle") return sum + (w.km || 0);
        if (w.art === "Joggen") return sum + (w.dauer * 0.15);
        return sum;
      }, 0);

      const time5k = data.workouts.filter(w => w.art === "5k");
      const time10k = data.workouts.filter(w => w.art === "10k");
      const avg5kTime = time5k.length ? Math.round(time5k.reduce((sum, w) => sum + w.dauer, 0) / time5k.length) : 0;
      const avg10kTime = time10k.length ? Math.round(time10k.reduce((sum, w) => sum + w.dauer, 0) / time10k.length) : 0;

      const getDayHealth = () => {
        const proteinRatio = totals.protein / totals.kcal * 100;
        if (totals.kcal > 500) {
          if (proteinRatio < 12) return "🥀";
          if (totals.carbs > 300) return "🥀";
          if (totals.fat > 100) return "🥀";
        }
        return "✅";
      };

      return (
        <div style={{ background: "#0d1117", minHeight: "100vh", color: "#f0f4ff" }}>
          {/* Header */}
          <div style={{ padding: "20px 20px 16px", borderBottom: "1px solid #1a2133", background: "linear-gradient(180deg, #111827 0%, #0d1117 100%)" }}>
            <div style={{ fontSize: 11, color: "#4ade80", letterSpacing: 2, textTransform: "uppercase", fontWeight: 700 }}>Fitness Tracker</div>
            <div style={{ fontSize: 20, fontWeight: 800, marginTop: 6, display: "flex", justifyContent: "space-between", alignItems: "center" }}>
              <div>{formatDate(currentDate)}</div>
              <div style={{ display: "flex", gap: 8, alignItems: "center" }}>
                <button onClick={() => setShowCalendar(!showCalendar)} style={{ background: "none", border: "none", color: "#60a5fa", fontSize: 16, cursor: "pointer" }}>📅</button>
                <button onClick={() => setShowResetConfirm(true)} style={{ background: "#1a2133", border: "1px solid #ef4444", color: "#ef4444", padding: "6px 12px", fontSize: 12, fontWeight: 700, cursor: "pointer", borderRadius: 6 }}>🗑️ Reset</button>
              </div>
            </div>
          </div>

          {showResetConfirm && (
            <div style={{ padding: 20, borderBottom: "1px solid #1a2133", background: "#1a2f2f" }}>
              <div style={{ fontSize: 12, color: "#f87171", fontWeight: 700, marginBottom: 10 }}>⚠️ Alle Daten vom {formatDate(currentDate)} löschen?</div>
              <div style={{ display: "flex", gap: 8 }}>
                <button onClick={() => {
                  setAllData(prev => ({
                    ...prev,
                    [currentDate]: { meals: [], workouts: [], water: 0, sleepDuration: 0, sleepScore: 0, bodyComp: false, kreatin: false, meds: false, proteinShake: false }
                  }));
                  setShowResetConfirm(false);
                }} style={{ flex: 1, padding: "10px", background: "#f87171", border: "none", borderRadius: 8, color: "#fff", fontWeight: 700, cursor: "pointer" }}>✅ Löschen</button>
                <button onClick={() => setShowResetConfirm(false)} style={{ flex: 1, padding: "10px", background: "#1a2133", border: "1px solid #6b7a99", borderRadius: 8, color: "#6b7a99", fontWeight: 700, cursor: "pointer" }}>Abbrechen</button>
              </div>
            </div>
          )}

          {showCalendar && (
            <div style={{ padding: 16, borderBottom: "1px solid #1a2133", background: "#111827" }}>
              <div style={{ display: "grid", gridTemplateColumns: "repeat(7, 1fr)", gap: 4, marginBottom: 12 }}>
                {["Su", "Mo", "Di", "Mi", "Do", "Fr", "Sa"].map(d => (
                  <div key={d} style={{ textAlign: "center", fontSize: 9, color: "#6b7a99", fontWeight: 700 }}>{d}</div>
                ))}
                {[...Array(31)].map((_, i) => {
                  const d = new Date();
                  d.setDate(i + 1);
                  const dateStr = d.toISOString().split('T')[0];
                  const hasData = !!allData[dateStr];
                  return (
                    <button key={i} onClick={() => { setCurrentDate(dateStr); setShowCalendar(false); }}
                      style={{ padding: 6, background: hasData ? "#1e3a3a" : "#0d1117", border: `1px solid ${dateStr === currentDate ? "#34d399" : "#1a2133"}`, borderRadius: 4, color: hasData ? "#34d399" : "#6b7a99", fontSize: 11, cursor: "pointer" }}>
                      {i + 1} {hasData ? "●" : ""}
                    </button>
                  );
                })}
              </div>
              <button onClick={() => setShowCalendar(false)} style={{ width: "100%", padding: "8px", background: "#1a2133", border: "none", borderRadius: 8, color: "#6b7a99", cursor: "pointer" }}>Schließen</button>
            </div>
          )}

          {/* CONTENT */}
          {tab === "today" && (
            <div style={{ padding: 20 }}>
              <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 12, marginBottom: 16 }}>
                <Ring value={totals.kcal} max={GOALS.kcal} color="#f59e0b" label="Kcal" unit={totals.kcal} />
                <Ring value={totals.protein} max={GOALS.protein} color="#60a5fa" label="Protein" unit="g" />
              </div>
              <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 10, marginBottom: 16 }}>
                <div style={{ background: "#111827", borderRadius: 12, padding: "14px 16px", border: "1px solid #1a2133" }}>
                  <div style={{ fontSize: 11, color: "#6b7a99", marginBottom: 2 }}>Fett</div>
                  <div style={{ fontSize: 18, fontWeight: 800, color: "#ec4899" }}>{totals.fat}g / {GOALS.fat}g</div>
                </div>
                <div style={{ background: "#111827", borderRadius: 12, padding: "14px 16px", border: "1px solid #1a2133" }}>
                  <div style={{ fontSize: 11, color: "#6b7a99", marginBottom: 2 }}>Carbs</div>
                  <div style={{ fontSize: 18, fontWeight: 800, color: "#a78bfa" }}>{totals.carbs}g / {GOALS.carbs}g</div>
                </div>
              </div>

              <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 10, marginBottom: 16 }}>
                <div style={{ background: "#111827", borderRadius: 12, padding: "14px 16px", border: "1px solid #1a2133" }}>
                  <div style={{ fontSize: 11, color: "#6b7a99", marginBottom: 2 }}>Wasser</div>
                  <div style={{ fontSize: 18, fontWeight: 800, color: "#34d399" }}>{data.water}ml</div>
                </div>
                <div style={{ background: "#111827", borderRadius: 12, padding: "14px 16px", border: "1px solid #1a2133" }}>
                  <div style={{ fontSize: 11, color: "#6b7a99", marginBottom: 2 }}>Km</div>
                  <div style={{ fontSize: 18, fontWeight: 800, color: "#34d399" }}>{kmToday.toFixed(1)}km</div>
                </div>
              </div>

              <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 10, marginBottom: 16 }}>
                <button onClick={() => updateDay({ bodyComp: !data.bodyComp })} style={{ background: data.bodyComp ? "#1e3a2f" : "#0d1117", border: `1px solid ${data.bodyComp ? "#34d399" : "#1a2133"}`, borderRadius: 8, color: data.bodyComp ? "#34d399" : "#8892aa", fontWeight: 700, padding: 10, fontSize: 13, cursor: "pointer" }}>⚖️ Body Comp</button>
                <button onClick={() => updateDay({ kreatin: !data.kreatin })} style={{ background: data.kreatin ? "#1e3a2f" : "#0d1117", border: `1px solid ${data.kreatin ? "#34d399" : "#1a2133"}`, borderRadius: 8, color: data.kreatin ? "#34d399" : "#8892aa", fontWeight: 700, padding: 10, fontSize: 13, cursor: "pointer" }}>💊 Kreatin</button>
              </div>

              <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 10, marginBottom: 16 }}>
                <button onClick={() => updateDay({ meds: !data.meds })} style={{ background: data.meds ? "#1e3a2f" : "#0d1117", border: `1px solid ${data.meds ? "#34d399" : "#1a2133"}`, borderRadius: 8, color: data.meds ? "#34d399" : "#8892aa", fontWeight: 700, padding: 10, fontSize: 13, cursor: "pointer" }}>💉 Medikamente</button>
                <button onClick={() => { updateDay({ proteinShake: !data.proteinShake }); addMeal({ name: "Protein Shake (300kcal, 40g)", kcal: 300, protein: 40 }); }} style={{ background: data.proteinShake ? "#1e3a2f" : "#0d1117", border: `1px solid ${data.proteinShake ? "#60a5fa" : "#1a2133"}`, color: data.proteinShake ? "#60a5fa" : "#8892aa", fontWeight: 700, padding: 10, fontSize: 13, cursor: "pointer", borderRadius: 8 }}>
                  {data.proteinShake ? "✅" : "⭕"} 💪 Protein Shake (300kcal, 40g)
                </button>
              </div>

              {/* BODY COMPOSITION */}
              <div style={{ fontSize: 12, color: "#6b7a99", marginBottom: 10, marginTop: 20, letterSpacing: 1, textTransform: "uppercase" }}>Body Composition (Morgens)</div>
              <div style={{ background: "#111827", borderRadius: 12, padding: 12, border: "1px solid #1a2133", marginBottom: 16, display: "grid", gridTemplateColumns: "1fr 1fr", gap: 8 }}>
                <div>
                  <label style={{ fontSize: 10, color: "#6b7a99", display: "block", marginBottom: 4 }}>Gewicht (kg)</label>
                  <input type="number" step="0.1" min="50" max="150" value={data.weight || ""} 
                    onChange={e => updateDay({ weight: +e.target.value || null })}
                    style={{ width: "100%", padding: "8px 10px", background: "#0d1117", border: "1px solid #1a2133", borderRadius: 8, color: "#f0f4ff", fontSize: 13, outline: "none" }} placeholder="z.B. 70.5" />
                </div>
                <div>
                  <label style={{ fontSize: 10, color: "#6b7a99", display: "block", marginBottom: 4 }}>KFA (%)</label>
                  <input type="number" step="0.1" min="5" max="50" value={data.bodyFat || ""} 
                    onChange={e => updateDay({ bodyFat: +e.target.value || null })}
                    style={{ width: "100%", padding: "8px 10px", background: "#0d1117", border: "1px solid #1a2133", borderRadius: 8, color: "#f0f4ff", fontSize: 13, outline: "none" }} placeholder="z.B. 22.5" />
                </div>
              </div>

              {/* SCHLAF */}
              <div style={{ fontSize: 12, color: "#6b7a99", marginBottom: 10, marginTop: 20, letterSpacing: 1, textTransform: "uppercase" }}>Schlaf Daten</div>
              <div style={{ background: "#111827", borderRadius: 12, padding: 12, border: "1px solid #1a2133", marginBottom: 16, display: "grid", gridTemplateColumns: "1fr 1fr 1fr", gap: 8 }}>
                <div>
                  <label style={{ fontSize: 10, color: "#6b7a99", display: "block", marginBottom: 4 }}>Stunden</label>
                  <input type="number" min="0" max="12" value={Math.floor(data.sleepDuration || 0)} 
                    onChange={e => {
                      const h = +e.target.value;
                      const min = Math.round(((data.sleepDuration || 0) % 1) * 60);
                      updateDay({ sleepDuration: h + min / 60 });
                    }}
                    style={{ width: "100%", padding: "8px 10px", background: "#0d1117", border: "1px solid #1a2133", borderRadius: 8, color: "#f0f4ff", fontSize: 13, outline: "none" }} placeholder="0-12" />
                </div>
                <div>
                  <label style={{ fontSize: 10, color: "#6b7a99", display: "block", marginBottom: 4 }}>Minuten</label>
                  <input type="number" min="0" max="59" value={Math.round(((data.sleepDuration || 0) % 1) * 60)} 
                    onChange={e => {
                      const h = Math.floor(data.sleepDuration || 0);
                      const min = +e.target.value;
                      updateDay({ sleepDuration: h + min / 60 });
                    }}
                    style={{ width: "100%", padding: "8px 10px", background: "#0d1117", border: "1px solid #1a2133", borderRadius: 8, color: "#f0f4ff", fontSize: 13, outline: "none" }} placeholder="0-59" />
                </div>
                <div>
                  <label style={{ fontSize: 10, color: "#6b7a99", display: "block", marginBottom: 4 }}>Score (0-100)</label>
                  <input type="number" min="0" max="100" value={data.sleepScore || ""} 
                    onChange={e => updateDay({ sleepScore: Math.min(100, +e.target.value) })}
                    style={{ width: "100%", padding: "8px 10px", background: "#0d1117", border: "1px solid #1a2133", borderRadius: 8, color: "#f0f4ff", fontSize: 13, outline: "none" }} placeholder="z.B. 85" />
                </div>
              </div>

              {/* WASSER */}
              <div style={{ marginBottom: 16 }}>
                <div style={{ fontSize: 12, color: "#6b7a99", marginBottom: 8, letterSpacing: 1, textTransform: "uppercase" }}>Wasser hinzufügen</div>
                <div style={{ display: "flex", gap: 8 }}>
                  {[250, 500, 750].map(ml => (
                    <button key={ml} onClick={() => addWater(ml)} style={{ flex: 1, padding: "10px 0", background: "#0d2137", border: "1px solid #1e4d6b", borderRadius: 10, color: "#34d399", fontWeight: 700, fontSize: 13, cursor: "pointer" }}>
                      +{ml}ml
                    </button>
                  ))}
                </div>
              </div>

              {/* VERBLEIBENDES DEFIZIT */}
              <div style={{ background: "#111827", borderRadius: 12, padding: "14px 16px", border: "1px solid #1a2133", marginBottom: 16 }}>
                <div style={{ fontSize: 11, color: "#6b7a99", marginBottom: 2 }}>Verbleibendes Defizit {getDayHealth()}</div>
                <div style={{ fontSize: 18, fontWeight: 800, color: GOALS.kcal - totals.kcal > 0 ? "#4ade80" : "#f87171" }}>
                  {GOALS.kcal - totals.kcal > 0 ? `${GOALS.kcal - totals.kcal} kcal` : "Ziel erreicht! ✅"}
                </div>
              </div>
            </div>
          )}

          {tab === "mahlzeiten" && (
            <div style={{ padding: 20 }}>
              <div style={{ display: "flex", flexWrap: "wrap", gap: 6, marginBottom: 14 }}>
                {mealPresets.map(p => (
                  <button key={p.name} onClick={() => setMeal({ name: p.name, kcal: p.kcal, protein: p.protein })} style={{
                    padding: "5px 10px", background: meal.name === p.name ? "#1e3a2f" : "#0d1117",
                    border: `1px solid ${meal.name === p.name ? "#4ade80" : "#1a2133"}`, borderRadius: 8,
                    color: meal.name === p.name ? "#4ade80" : "#8892aa", fontSize: 11, cursor: "pointer"
                  }}>{p.name}</button>
                ))}
              </div>

              <div style={{ background: "#111827", borderRadius: 12, padding: 12, border: "1px solid #1a2133", marginBottom: 14, display: "grid", gridTemplateColumns: "1fr 1fr", gap: 8 }}>
                <div>
                  <label style={{ fontSize: 10, color: "#6b7a99", display: "block", marginBottom: 4 }}>Name</label>
                  <input type="text" value={meal.name} onChange={e => setMeal({ ...meal, name: e.target.value })}
                    style={{ width: "100%", padding: "8px 10px", background: "#0d1117", border: "1px solid #1a2133", borderRadius: 8, color: "#f0f4ff", fontSize: 13, outline: "none" }} placeholder="z.B. Pizza" />
                </div>
                <div>
                  <label style={{ fontSize: 10, color: "#6b7a99", display: "block", marginBottom: 4 }}>kcal</label>
                  <input type="number" value={meal.kcal} onChange={e => setMeal({ ...meal, kcal: +e.target.value })}
                    style={{ width: "100%", padding: "8px 10px", background: "#0d1117", border: "1px solid #1a2133", borderRadius: 8, color: "#f0f4ff", fontSize: 13, outline: "none" }} placeholder="500" />
                </div>
                <div>
                  <label style={{ fontSize: 10, color: "#6b7a99", display: "block", marginBottom: 4 }}>Protein (g)</label>
                  <input type="number" value={meal.protein} onChange={e => setMeal({ ...meal, protein: +e.target.value })}
                    style={{ width: "100%", padding: "8px 10px", background: "#0d1117", border: "1px solid #1a2133", borderRadius: 8, color: "#f0f4ff", fontSize: 13, outline: "none" }} placeholder="25" />
                </div>
                <button onClick={() => { addMeal(meal); setMeal({ name: "", kcal: "", protein: "" }); }}
                  style={{ background: "#4ade80", border: "none", borderRadius: 8, color: "#000", fontWeight: 700, cursor: "pointer", fontSize: 13 }}>➕ Hinzufügen</button>
              </div>

              {data.meals.map((m, i) => (
                <div key={i} style={{ background: "#111827", borderRadius: 12, padding: "12px 16px", border: "1px solid #1a2133", marginBottom: 8, display: "flex", justifyContent: "space-between", alignItems: "center" }}>
                  <div style={{ flex: 1 }}>
                    <div style={{ fontSize: 13, fontWeight: 600, marginBottom: 2 }}>{m.name}</div>
                    <div style={{ fontSize: 11, color: "#8892aa" }}>{m.kcal} kcal | {m.protein}g Protein</div>
                  </div>
                  <button onClick={() => removeMeal(i)} style={{ background: "#f87171", border: "none", borderRadius: 6, color: "#fff", padding: "6px 10px", fontSize: 12, fontWeight: 700, cursor: "pointer" }}>✕</button>
                </div>
              ))}
            </div>
          )}

          {tab === "workout" && (
            <div style={{ padding: 20 }}>
              <div style={{ background: "#111827", borderRadius: 12, padding: 12, border: "1px solid #1a2133", marginBottom: 14 }}>
                <div style={{ fontSize: 11, color: "#6b7a99", marginBottom: 8, textTransform: "uppercase" }}>Cardio</div>
                <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 8, marginBottom: 12 }}>
                  {["5k", "10k", "Intervalle", "Joggen"].map(art => (
                    <button key={art} onClick={() => document.getElementById(`workout-${art}`).focus()}
                      style={{ padding: "8px", background: "#0d1117", border: "1px solid #1a2133", borderRadius: 8, color: "#8892aa", fontSize: 12, cursor: "pointer" }}>
                      {art === "5k" ? "🏃 5k" : art === "10k" ? "🏃 10k" : art === "Intervalle" ? "⚡ Intervalle" : "🚶 Joggen"}
                    </button>
                  ))}
                </div>
                <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 8 }}>
                  <input id="workout-time" type="number" placeholder="Zeit (min)" style={{ padding: "8px 10px", background: "#0d1117", border: "1px solid #1a2133", borderRadius: 8, color: "#f0f4ff", outline: "none" }} />
                  <input id="workout-km" type="number" placeholder="Km (für Intervalle)" style={{ padding: "8px 10px", background: "#0d1117", border: "1px solid #1a2133", borderRadius: 8, color: "#f0f4ff", outline: "none" }} />
                </div>
                <button onClick={() => {
                  const dauer = +document.getElementById("workout-time").value;
                  const km = +document.getElementById("workout-km").value || 0;
                  if (dauer) {
                    addWorkout({ art: "5k", dauer });
                    document.getElementById("workout-time").value = "";
                  }
                }} style={{ width: "100%", marginTop: 8, padding: "10px", background: "#34d399", border: "none", borderRadius: 8, color: "#000", fontWeight: 700, cursor: "pointer" }}>➕ Training</button>
              </div>

              {data.workouts.map((w, i) => (
                <div key={i} style={{ background: "#111827", borderRadius: 12, padding: "12px 16px", border: "1px solid #1a2133", marginBottom: 8, display: "flex", justifyContent: "space-between", alignItems: "center" }}>
                  <div>
                    <div style={{ fontSize: 13, fontWeight: 600 }}>{w.art} - {w.dauer}min {w.km ? `(${w.km}km)` : ""}</div>
                  </div>
                  <button onClick={() => removeWorkout(i)} style={{ background: "#f87171", border: "none", borderRadius: 6, color: "#fff", padding: "6px 10px", fontSize: 12, fontWeight: 700, cursor: "pointer" }}>✕</button>
                </div>
              ))}
            </div>
          )}

          {tab === "fortschritt" && (
            <div style={{ padding: 20 }}>
              {/* Export/Import Buttons */}
              <div style={{ display: "flex", gap: 6, marginBottom: 16, justifyContent: "flex-end" }}>
                <button onClick={exportData} title="Alle Daten herunterladen" style={{ background: "#1a3a3a", border: "1px solid #34d399", color: "#34d399", padding: "4px 8px", fontSize: 10, fontWeight: 600, cursor: "pointer", borderRadius: 4 }}>💾 Export</button>
                <button onClick={importData} title="Daten importieren" style={{ background: "#3a2a1a", border: "1px solid #fbbf24", color: "#fbbf24", padding: "4px 8px", fontSize: 10, fontWeight: 600, cursor: "pointer", borderRadius: 4 }}>📂 Import</button>
              </div>

              <div style={{ background: "#111827", borderRadius: 16, padding: 16, border: "1px solid #1a2133", marginBottom: 16 }}>
                <div style={{ fontSize: 12, color: "#6b7a99", marginBottom: 12, textTransform: "uppercase" }}>7-Tage Durchschnitt</div>
                <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 12, marginBottom: 12 }}>
                  <div>
                    <div style={{ fontSize: 11, color: "#6b7a99", marginBottom: 2 }}>Schlaf Dauer</div>
                    <div style={{ fontSize: 20, fontWeight: 800, color: "#a78bfa" }}>{avgSleepDuration}h</div>
                  </div>
                  <div>
                    <div style={{ fontSize: 11, color: "#6b7a99", marginBottom: 2 }}>Schlaf Score</div>
                    <div style={{ fontSize: 20, fontWeight: 800, color: "#a78bfa" }}>{avgSleepScore}</div>
                  </div>
                  <div>
                    <div style={{ fontSize: 11, color: "#6b7a99", marginBottom: 2 }}>Ø Kalorien</div>
                    <div style={{ fontSize: 18, fontWeight: 800, color: "#f59e0b" }}>{avgKcal}</div>
                  </div>
                  <div>
                    <div style={{ fontSize: 11, color: "#6b7a99", marginBottom: 2 }}>Ø Protein</div>
                    <div style={{ fontSize: 18, fontWeight: 800, color: "#60a5fa" }}>{avgProtein}g</div>
                  </div>
                </div>
              </div>

              <div style={{ background: "#111827", borderRadius: 16, padding: 16, border: "1px solid #1a2133", marginBottom: 16 }}>
                <div style={{ fontSize: 12, color: "#6b7a99", marginBottom: 12, textTransform: "uppercase" }}>Body Composition Trend</div>
                {bodyCompGraphData.length > 0 ? (
                  <>
                    {SimpleLineGraph({
                      data: bodyCompGraphData.map(d => d.weight).filter(w => w),
                      label: "Körpergewicht",
                      color: "#60a5fa",
                      unit: "kg"
                    })}
                    {SimpleLineGraph({
                      data: bodyCompGraphData.map(d => d.bodyFat).filter(bf => bf),
                      label: "Körperfettanteil",
                      color: "#f87171",
                      unit: "%"
                    })}
                  </>
                ) : (
                  <div style={{ fontSize: 11, color: "#6b7a99", padding: 12 }}>Gib morgens Gewicht und KFA ein um Trends zu sehen</div>
                )}
              </div>
            </div>
          )}

          {/* TAB BUTTONS */}
          <div style={{ position: "fixed", bottom: 0, left: 0, right: 0, borderTop: "1px solid #1a2133", background: "linear-gradient(180deg, #111827 0%, #0d1117 100%)", display: "grid", gridTemplateColumns: "repeat(4, 1fr)", gap: 0 }}>
            {[
              { key: "today", label: "Übersicht", icon: "📊" },
              { key: "mahlzeiten", label: "Mahlzeiten", icon: "🍽️" },
              { key: "workout", label: "Training", icon: "💪" },
              { key: "fortschritt", label: "Fortschritt", icon: "📈" },
            ].map(t => (
              <button key={t.key} onClick={() => setTab(t.key)} style={{
                padding: "10px 0", border: "none", background: tab === t.key ? "#1e3a3a" : "#0d1117",
                color: tab === t.key ? "#34d399" : "#6b7a99", fontWeight: 700, cursor: "pointer", fontSize: 12
              }}>
                {t.icon} {t.label}
              </button>
            ))}
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<FitnessTracker />);
  </script>
</body>
</html>
